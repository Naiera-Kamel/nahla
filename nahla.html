<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>النَّحْلَةُ الْمُفِيدَةُ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#fff6d6;color:#3d2c0a;font-family:Tahoma,"Segoe UI","Noto Naskh Arabic",Arial,sans-serif;text-align:center}
h1{margin:6px 0 2px;font-size:26px}
.path{margin:8px auto;max-width:640px;font-size:30px}
.path span{display:inline-block;margin:0 6px;opacity:.25;transition:all .3s}
.path span.on{opacity:1;transform:scale(1.25)}
.card{background:#fff;border-radius:22px;padding:18px;max-width:680px;margin:10px auto;box-shadow:0 5px 16px rgba(0,0,0,.15)}
.scene{font-size:54px}
.hint{font-size:18px;color:#8a5a00}
.task{display:inline-block;background:#ffd166;border-radius:14px;padding:8px 16px;font-size:22px;margin:8px 0;font-weight:bold}
.sent{font-size:30px;line-height:2.4;margin:8px 0}
.w{display:inline-block;padding:0 8px;margin:2px;border-radius:12px;cursor:pointer}
.w.on{background:#ffd166}
.w.ok{background:#b7e4c7}
.w.no{background:#f9c6b8}
button{font-family:inherit;font-size:20px;border:0;border-radius:16px;padding:10px 20px;margin:6px;background:#e09f1f;color:#fff;cursor:pointer}
button.alt{background:#6c757d}
.msg{font-size:22px;min-height:32px;margin:6px}
.stars{font-size:40px}
</style></head><body>
<h1>🐝 النَّحْلَةُ الْمُفِيدَةُ 🐝</h1>
<div class="path" id="path"></div>
<div class="card" id="card"></div>
<script>
(function(){
var L={
tf:"تَنْوِينُ الْفَتْحِ ( ــً )",td:"تَنْوِينُ الضَّمِّ ( ــٌ )",tk:"تَنْوِينُ الْكَسْرِ ( ــٍ )",
ma:"مَدٌّ بِالْأَلِفِ ( ا )",mw:"مَدٌّ بِالْوَاوِ ( و )",ms:"الْأَلِفُ الْمَقْصُورَةُ ( ى )",
dg:"الْأَلِفُ الْخِنْجَرِيَّةُ ( ــٰ )",sh:"لَامٌ شَمْسِيَّةٌ ( لَا تُنْطَقُ )",qm:"لَامٌ قَمَرِيَّةٌ ( تُنْطَقُ )"};
var S=[
{e:"🐝🏡",p:"🐝",w:["النَّحْلُ","حَشَرَاتٌ","نَافِعَةٌ","تَعِيشُ","فِي","خَلِيَّةٍ","كَبِيرَةٍ"],
 q:[["td",[1,2]],["tk",[5,6]],["ma",[2]]]},
{e:"🌸",p:"🌸",w:["تَطِيرُ","النَّحْلَةُ","إِلَى","الْأَزْهَارِ","وَتَمْتَصُّ","رَحِيقًا","حُلْوًا"],
 q:[["tf",[5,6]],["ms",[2]],["qm",[3]],["sh",[1]]]},
{e:"🍯",p:"🍯",w:["هَٰذَا","الْعَسَلُ","غِذَاءٌ","مُفِيدٌ","وَدَوَاءٌ","لِلنَّاسِ"],
 q:[["dg",[0]],["qm",[1]],["ma",[2,4,5]]]},
{e:"🍎🌼",p:"🍎",w:["وَتَنْقُلُ","النَّحْلَةُ","غُبَارَ","الزَّهْرِ","مِنْ","زَهْرَةٍ","إِلَى","أُخْرَى","فَتَنْمُو","الثِّمَارُ"],
 q:[["mw",[8]],["ms",[6,7]],["ma",[2,9]],["sh",[1,3,9]]]},
{e:"🤲",p:"🤲",w:["سُبْحَانَ","اللَّٰهِ","الَّذِي","عَلَّمَ","النَّحْلَةَ","هَٰذَا","الْعَمَلَ","الْعَظِيمَ"],
 q:[["dg",[1,5]],["sh",[4]],["qm",[6,7]]]}
];
var i=0,q=0,miss=0,lock=false;
function $(id){return document.getElementById(id);}
function say(x){
 try{
  if(window.speechSynthesis&&window.SpeechSynthesisUtterance){
   window.speechSynthesis.cancel();
   var u=new SpeechSynthesisUtterance(x);u.lang="ar-SA";u.rate=0.7;
   window.speechSynthesis.speak(u);
  }
 }catch(e){}
}
function path(){
 var h="",k;
 for(k=0;k<S.length;k++){h+='<span class="'+(k<i?'on':'')+'">'+S[k].p+'</span>';}
 $("path").innerHTML=h;
}
function sentHtml(s){
 var h="",k;
 for(k=0;k<s.w.length;k++){h+='<span class="w" id="w'+k+'">'+s.w[k]+'</span> ';}
 return h;
}
function read(){
 var s=S[i],k;
 path();q=0;
 $("card").innerHTML='<div class="scene">'+s.e+'</div>'+
 '<div class="hint">اقْرَئِي الْجُمْلَةَ، وَاُنْقُرِي عَلَى أَيِّ كَلِمَةٍ لِتَسْمَعِيهَا 👆</div>'+
 '<div class="sent">'+sentHtml(s)+'</div>'+
 '<button class="alt" id="ls">🔊 اسْتَمِعِي</button><button id="go">أَنَا جَاهِزَةٌ ✅</button>';
 for(k=0;k<s.w.length;k++){(function(n,t){n.onclick=function(){n.className="w on";say(t);};})($("w"+k),s.w[k]);}
 $("ls").onclick=function(){say(s.w.join(" "));};
 $("go").onclick=quiz;
}
function quiz(){
 var s=S[i],cur=s.q[q],k;lock=false;
 $("card").innerHTML='<div class="scene">'+s.e+'</div>'+
 '<div class="hint">🔎 السُّؤَالُ '+(q+1)+' مِنْ '+s.q.length+'</div>'+
 '<div class="task">اُنْقُرِي عَلَى كَلِمَةٍ فِيهَا:<br>'+L[cur[0]]+'</div>'+
 '<div class="sent">'+sentHtml(s)+'</div><div class="msg" id="m"></div>';
 for(k=0;k<s.w.length;k++){(function(n,idx){n.onclick=function(){
  if(lock){return;}
  if(cur[1].indexOf(idx)>-1){
   lock=true;n.className="w ok";say(s.w[idx]);$("m").innerHTML="🌟 أَحْسَنْتِ!";
   setTimeout(function(){
    q++;
    if(q<s.q.length){quiz();}
    else{i++;if(i<S.length){read();}else{end();}}
   },1300);
  }else{n.className="w no";miss++;$("m").innerHTML="حَاوِلِي مَرَّةً أُخْرَى 💪";}
 };})($("w"+k),k);}
}
function end(){
 var n=miss<=1?3:(miss<=4?2:1),st="",k,all=[];
 for(k=0;k<3;k++){st+=k<n?"⭐":"☆";}
 for(k=0;k<S.length;k++){all.push(S[k].w.join(" "));}
 var full=all.join("، ")+".";
 path();
 $("card").innerHTML='<div class="scene">🏆</div><h2>أَحْسَنْتِ يَا بَطَلَةَ الْقِرَاءَةِ!</h2><div class="stars">'+st+'</div>'+
 '<div class="hint">اقْرَئِي الْقِطْعَةَ كَامِلَةً 📖</div><div class="sent" style="font-size:26px">'+full+'</div>'+
 '<button class="alt" id="all">🔊 اسْتَمِعِي</button><button id="re">🔁 نَلْعَبُ مَرَّةً أُخْرَى</button>';
 $("all").onclick=function(){say(full);};
 $("re").onclick=function(){i=0;q=0;miss=0;read();};
}
read();
})();
</script></body></html>
